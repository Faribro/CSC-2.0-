server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: csc2-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/csc2_dev?currentSchema=csc2}
    username: ${SPRING_DATASOURCE_USERNAME:csc2_app}
    password: ${DB_APP_PASSWORD:csc2_app_secret_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/csc2_dev?currentSchema=csc2}
    user: ${FLYWAY_USER:csc2_migration}
    password: ${DB_MIGRATION_PASSWORD:csc2_migration_secret_pass}
    schemas: csc2
    default-schema: csc2
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: csc2
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  demo:
    fixed-otp-enabled: ${DEMO_FIXED_OTP_ENABLED:false}
    auto-roster-enabled: ${DEMO_AUTO_ROSTER_ENABLED:false}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080,https://*.vercel.app,https://*.trycloudflare.com,https://*.onrender.com}
  jwt:
    secret: ${JWT_SIGNING_SECRET:local_dev_only_synthetic_jwt_signing_key_never_used_in_prod_0123456789}
    expiration-ms: 86400000
  service:
    credential: ${SERVICE_CREDENTIAL:local_dev_service_secret_token_abcdef123456789}
  apps-script:
    gateway-url: ${APPS_SCRIPT_GATEWAY_URL:https://script.google.com/macros/s/AKfycbwDZRDCm5TgOAL4wVkGgLBkxQtthZYBzkUTd_M3PNrSF_srx0a78rcEuSU7byHqp7AjnQ/exec}
    gateway-secret: ${APPS_SCRIPT_GATEWAY_SECRET:local_gateway_synthetic_secret_token_12345}
  notification:
    provider: ${NOTIFICATION_PROVIDER:apps_script}
    apps-script-url: ${APPS_SCRIPT_GATEWAY_URL:https://script.google.com/macros/s/AKfycbwDZRDCm5TgOAL4wVkGgLBkxQtthZYBzkUTd_M3PNrSF_srx0a78rcEuSU7byHqp7AjnQ/exec}
    apps-script-credential: ${APPS_SCRIPT_GATEWAY_SECRET:local_gateway_synthetic_secret_token_12345}
  sms:
    provider: ${SMS_PROVIDER:mock}
    textbee:
      api-key: ${TEXTBEE_API_KEY:}
      device-id: ${TEXTBEE_DEVICE_ID:}
      base-url: ${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1/gateway}
